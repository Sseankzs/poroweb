name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets you re-run a deploy from the Actions tab without pushing.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        env:
          # The repo is served from https://<user>.github.io/poroweb/
          NEXT_PUBLIC_BASE_PATH: /poroweb
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # `output: "export"` writes here.
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
